services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: enterprise_agent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - enterprise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d enterprise_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  enterprise_pgdata:

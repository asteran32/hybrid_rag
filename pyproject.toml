[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
parquet = ["pyarrow>=18"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = ["integration: requires a disposable schema in TEST_DATABASE_URL"]

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1,<3",
    "model2vec>=0.10,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
answer = ["openai>=1.55,<3", "onnxruntime>=1.20,<2", "numpy>=1.26,<3", "tokenizers>=0.20,<1", "langgraph>=1.0,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
openai = ["openai>=1.55,<3"]
parquet = ["pyarrow>=18"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable schema in TEST_DATABASE_URL",
    "llm: exercises an LLM provider or its chat adapter",
]
